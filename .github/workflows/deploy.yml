name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ============================================================
# 需要在 GitHub Repository Settings → Secrets and variables → Actions 中配置：
#
# 【必填】
#   VITE_COACH_APP_ID        应用 ID（如 21bcc71b92e54b8792c7a49d7476ca1d）
#
# 【二选一】推荐 Worker 方案
#   VITE_COACH_API_BASE      Cloudflare Worker URL（如 https://dongzhi-coach-api.workers.dev）
#   — Worker 在服务端注入 Authorization，密钥不会暴露给浏览器
#
# 【二选一】快速直连方案（不推荐，密钥会暴露）
#   VITE_COACH_API_KEY       DashScope API Key（sk-...）
#   VITE_COACH_API_TARGET    DashScope 目标地址（可选，默认 https://dashscope.aliyuncs.com）
#
# 【可选】画像服务
#   VITE_PROFILE_API_BASE    生产环境不可用，留空即可，前端自动回退 localStorage
# ============================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_COACH_APP_ID: ${{ secrets.VITE_COACH_APP_ID }}
          VITE_COACH_API_BASE: ${{ secrets.VITE_COACH_API_BASE }}
          VITE_COACH_API_KEY: ${{ secrets.VITE_COACH_API_KEY }}
          VITE_COACH_API_TARGET: ${{ secrets.VITE_COACH_API_TARGET }}
          VITE_PROFILE_API_BASE: ${{ secrets.VITE_PROFILE_API_BASE }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
