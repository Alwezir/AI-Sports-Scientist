<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重定向中...</title>
  <script>
    (function() {
      var basePath = '/AI-Sports-Scientist/';
      var path = window.location.pathname;
      var hash = window.location.hash;
      
      // 如果路径以 basePath 开头，去掉 basePath
      if (path.startsWith(basePath)) {
        path = path.substring(basePath.length);
      } else if (path.startsWith('/')) {
        path = path.substring(1);
      }
      
      // 如果路径为空或只是 basePath，重定向到首页
      if (!path || path === '') {
        window.location.replace(basePath + (hash || ''));
      } else {
        // 否则，重定向到 basePath + path
        window.location.replace(basePath + path + hash);
      }
    })();
  </script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #06060e;
      color: #8888a8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e1e36;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>页面加载中...</p>
  </div>
</body>
</html>
